[project]
name = "schema-automation"
version = "0.1.0"
description = "Herramientas para automatizar la generación de schema.org para Naranja X"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0,<5.0",
    "html5lib>=1.1,<2.0",
    "jinja2>=3.1.0,<4.0",
    "lxml>=5.0.0,<6.0",
    "pandas>=2.0.0,<3.0",
    "requests>=2.31.0,<3.0",
    "requests-cache>=1.1.0,<2.0",
    "streamlit>=1.30.0,<2.0",
    "tenacity>=8.2.0,<9.0",
    "w3lib>=2.1.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9.0",
    "requests-mock>=1.11.0,<2.0",
]
# Solo para mcp_server.py. El SDK 2.x renombro FastMCP a MCPServer, asi que la
# version importa: con mcp<2 el import del servidor falla.
mcp = [
    "mcp>=2.0.0,<3.0",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
